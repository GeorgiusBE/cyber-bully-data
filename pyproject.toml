[project]
name = "emkademy"
version = "0.1.0"
description = ""
authors = [
    { name = "Georgius Benedikt Ermanta", email = "georgiusbenedikt09@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "hydra-core>=1.3.5,<2.0",
    "pydantic>=1.10.26,<2.0",
    "google-cloud-secret-manager>=2.30.0,<3.0",
    "dvc[gdrive,gs]>=3.67.1,<4.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3,<5.0",
    "pytest>=9.1.1,<10.0",
    "black>=26.5.1,<27.0",
    "isort>=8.0.1,<9.0",
    "flake8>=7.3.0,<8.0",
    "mypy>=2.3.1,<3.0",
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.4,<3.0"
packages = [{ include = "cybulde" }]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
indent = 4
lines_between_types = 1
known_first_party = ["cybulde"]
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
ignore_missing_imports = true
install_types = true
non_interactive = true
follow_imports = "silent"
no_strict_optional = true

warn_redundant_casts = false
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
warn_no_return = true
warn_incomplete_stub = true

disallow_subclassing_any = true

disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
strict_optional = true

verbosity = 0
